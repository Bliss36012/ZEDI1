name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and Build
        run: |
          mkdir -p /tmp/dist_output
          if [ -f "package.json" ]; then
            npm ci || npm install
            npm run build
            cp -r dist/* /tmp/dist_output/
          else
            cd *dispensary* || cd */
            npm ci || npm install
            npm run build
            cp -r dist/* /tmp/dist_output/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/dist_output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
